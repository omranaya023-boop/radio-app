<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <header>
    <div class="logo">📻 Radio</div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="search" placeholder="Search a station..." />
    </div>
  </header>

  <main>
    <div id="status" class="status">Loading stations...</div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="player" id="player">
    <img id="np-img" src="" alt="" />
    <div class="np-info">
      <div id="np-name">No station selected</div>
      <div id="np-country">—</div>
    </div>
    <button id="play-btn"><i class="fas fa-play"></i></button>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
    <audio id="audio"></audio>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
